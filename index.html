<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>WAF AI BATTLE LAB</title>

<style>
body{
  background:#070b10;
  color:#eaf6ff;
  font-family:monospace;
  margin:0;
}

/* === 中間戰場 === */
.battle-zone{
  position:relative;
  height:300px;
  border-top:1px solid #222;
  border-bottom:1px solid #222;
  overflow:hidden;
}

/* 中間發射點 */
.origin{
  position:absolute;
  top:10px;
  left:50%;
  transform:translateX(-50%);
  color:#46f0ff;
  font-size:12px;
}

/* payload 方塊 */
.packet{
  position:absolute;
  width:16px;
  height:16px;
  border:2px solid var(--c);
  border-radius:4px;
  left:50%;
  top:20px;
  transform:translateX(-50%);
  animation:split 1.2s forwards;
}

/* 分流動畫 */
@keyframes split{
  0%{
    transform:translate(-50%,0);
    opacity:1;
  }
  40%{
    transform:translate(-50%,120px);
  }
  100%{
    transform:translate(var(--x),260px);
    opacity:0;
  }
}

/* 左右結果 */
.compare{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  padding:20px;
}

.card{
  border:1px solid #333;
  padding:20px;
  border-radius:8px;
}

.left{
  border-color:#ff5c7a;
}

.right{
  border-color:#67f29a;
}

.result{
  margin-top:10px;
  font-size:22px;
  font-weight:bold;
}

.bypass{
  color:#ff5c7a;
}

.block{
  color:#67f29a;
}

button{
  margin:20px;
  padding:10px 20px;
  font-weight:bold;
  cursor:pointer;
}
</style>
</head>

<body>

<button onclick="runDemo()">▶ RUN DEMO</button>

<div class="battle-zone">
  <div class="origin">PAYLOAD SPLIT</div>
</div>

<div class="compare">
  <div class="card left">
    <h3>LEFT：Normal WAF</h3>
    <div id="left-status">WAITING</div>
    <div class="result bypass" id="left-result">--</div>
  </div>

  <div class="card right">
    <h3>RIGHT：Decoder + WAF</h3>
    <div id="right-status">WAITING</div>
    <div class="result block" id="right-result">--</div>
  </div>
</div>

<script>

/* === 產生分流 payload === */
function spawnPacket(color, direction){
  const p = document.createElement("div");
  p.className = "packet";
  p.style.setProperty("--c", color);

  // 左右方向
  if(direction === "left"){
    p.style.setProperty("--x","-220px");
  }else{
    p.style.setProperty("--x","220px");
  }

  document.querySelector(".battle-zone").appendChild(p);

  setTimeout(()=>p.remove(),1200);
}

/* === Demo 主流程 === */
async function runDemo(){

  // reset
  document.getElementById("left-result").innerText="--";
  document.getElementById("right-result").innerText="--";

  document.getElementById("left-status").innerText="Testing...";
  document.getElementById("right-status").innerText="Testing...";

  // Step1: payload 從中間產生
  spawnPacket("#4dabff","left");
  spawnPacket("#4dabff","right");

  await sleep(1200);

  // Step2: 左邊 Normal WAF（被繞過）
  spawnPacket("#ff5c7a","left");

  document.getElementById("left-status").innerText="No decode → CRS miss";
  document.getElementById("left-result").innerText="BYPASSED ❌";

  // Step3: 右邊 Decoder + WAF（擋住）
  spawnPacket("#67f29a","right");

  document.getElementById("right-status").innerText="Decoded → rule matched";
  document.getElementById("right-result").innerText="BLOCKED ✅";
}

/* === 小工具 === */
function sleep(ms){
  return new Promise(r=>setTimeout(r,ms));
}

</script>

</body>
</html>
